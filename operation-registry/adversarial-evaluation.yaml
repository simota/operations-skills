# Frozen before implementation. This is a design-review oracle, NOT measured model routing.
baseline: 5e2a543ad4c6c799b3e3b79be450ee841acf3093
method: description-only manual review; no production commands and no independent agent trials
scope: advisory execution boundary and observation safety; other findings remain open
predictions:
  P1: >-
    Replacing autonomy with human-operator approval terms and delivering the advisory boundary
    to all five skills will remove the contract reading that lets an agent execute a T1/T2
    system mutation. T3 confirmation and T4 two-person approval must remain unchanged.
    Falsifier: any tier or delivered block still grants the agent system-mutation authority.
  P2: >-
    Removing unreviewed Ansible playbooks and fact gathering from the unconditional read-only
    capture path will prevent check_mode:false or executable custom facts from being treated
    as passive observation. Falsifier: the capture page still says all its examples are
    read-only, or an unreviewed --check run is still recommended for agent execution.
  P3: >-
    Requiring target/scope/semantics checks for observation and a meaningful preflight for
    reversible changes, rather than universal dry-run output, will permit a bounded read-only
    query without a fictitious dry run while retaining rollback and approval requirements.
    Falsifier: read-only T1 needs a rollback, or T2 loses its reversal/preflight obligation.
interpretation:
  standalone: select the first skill without manufacturing a registry chain
  conditional: expected route omits later stages unless a finding requires them; baseline routes may not express this
  candidates: plausible competing owners; not the result of a model trial
  cross_pack: actual sibling descriptions were read; monitoring-tooling is a hypothetical comparator, not an installed skill
  baseline_findings:
    - outage and ship-it unconditionally append runbook work
    - go-live unconditionally includes oncall despite service tier
    - learn unconditionally appends readiness
    - review-to-ready sends capacity and staffing findings to runbook
    - quality-gate and operation-change overlap on an underspecified ship decision
