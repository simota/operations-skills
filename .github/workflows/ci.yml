name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 3.9 is the python3 macOS ships; the tools have to start there, and a
    # `str | None` annotation once kept one of them from doing so.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml==6.0.2
      - name: Static rules
        run: python3 operation-tools/validate.py
      - name: Every rule still fires
        run: python3 operation-tools/test_validate.py
      # The third leg of `make check`. A CLI the runner lacks reports SKIPPED and
      # passes; the page-side half of every claim is checked either way.
      - name: Quoted CLI behaviour still holds
        run: python3 operation-tools/figures_check.py
      - name: Delivered blocks are current
        run: |
          python3 operation-tools/render.py
          git diff --exit-code || {
            echo "SKILL.md delivery blocks are stale — run: make render"; exit 1; }
